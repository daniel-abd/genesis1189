<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Autorização · GENESIS 1189</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body><main>
<header><img src="logo.png" alt="GENESIS 1189"></header>
<h1 id="titulo">Autorização do TikTok</h1>
<p id="instrucao">Copie o código abaixo e cole no terminal, onde o programa está esperando.</p>
<div class="codigo" id="codigo">—</div>
<button id="copiar" type="button">Copiar código</button>
<p class="muted" id="estado"></p>
<script>
  // Esta página não envia nada a lugar nenhum: só mostra o código que o TikTok colocou no endereço.
  var p = new URLSearchParams(window.location.search);
  var codigo = p.get("code"), erro = p.get("error");
  var caixa = document.getElementById("codigo");
  if (codigo) {
    caixa.textContent = codigo;
  } else {
    document.getElementById("titulo").textContent = "Autorização não concluída";
    document.getElementById("instrucao").textContent = erro
      ? "O TikTok respondeu: " + erro + " " + (p.get("error_description") || "")
      : "Nenhum código no endereço. Rode de novo: python -m bibliacron tiktok conectar";
    document.getElementById("copiar").style.display = "none";
  }
  document.getElementById("copiar").onclick = function () {
    navigator.clipboard.writeText(codigo).then(function () {
      document.getElementById("estado").textContent = "Copiado.";
    });
  };
</script>
</main></body>
</html>
